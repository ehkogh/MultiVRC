version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    labels: [dependencies, site]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
