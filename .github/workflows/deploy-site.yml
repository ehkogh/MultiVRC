name: Deploy site

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to multivrc.ehko.dev
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://multivrc.ehko.dev
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Skip without a Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        working-directory: .
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the site was not deployed."

      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
