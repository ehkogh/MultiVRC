name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  linux:
    name: Build for Linux
    # Linux ships in pre-releases only (vX.Y.Z-beta.N) until it has been tried on real machines.
    if: contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test tests/MultiVRC.Core.Tests -c Release

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/MultiVRC.App -c Release -r linux-x64 --self-contained true "-p:Version=$version" -o publish --nologo
          find publish -name '*.pdb' -delete
          chmod +x publish/MultiVRC
          # zip keeps the executable bit, which the launcher's self-update relies on.
          (cd publish && zip -qr ../MultiVRC-linux-x64.zip .)
          printf '%s  MultiVRC-linux-x64.zip' "$(sha256sum MultiVRC-linux-x64.zip | cut -d' ' -f1)" > MultiVRC-linux-x64.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: MultiVRC-linux-x64.zip*

  release:
    name: Build and publish
    needs: linux
    # Runs when the Linux build succeeded, or was skipped because this is a stable release.
    if: ${{ !cancelled() && needs.linux.result != 'failure' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag ${{ github.ref_name }} is not vX.Y.Z or vX.Y.Z-pre." }
          "value=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-'))".ToLower() >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/MultiVRC.Core.Tests -c Release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          dotnet publish src/MultiVRC.App -c Release -r win-x64 --self-contained true -p:Version=$version -o publish --nologo
          Get-ChildItem publish -Filter *.pdb | Remove-Item
          Compress-Archive -Path publish/* -DestinationPath MultiVRC-win-x64.zip
          $hash = (Get-FileHash MultiVRC-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MultiVRC-win-x64.zip" | Out-File -Encoding ascii -NoNewline MultiVRC-win-x64.zip.sha256
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" "/DNumericVersion=$($version.Split('-')[0])" "/DPublishDir=$PWD\publish" installer\MultiVRC.iss
          if ($LASTEXITCODE) { throw 'Inno Setup failed' }

      - uses: actions/download-artifact@v7
        if: needs.linux.result == 'success'
        with:
          name: linux

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $extra = @()
          if ("${{ steps.version.outputs.prerelease }}" -eq 'true') { $extra += '--prerelease' }
          $files = @('MultiVRC-win-x64.zip', 'MultiVRC-win-x64.zip.sha256', (Get-ChildItem installer/out/MultiVRC-Setup-*.exe).FullName)
          if (Test-Path MultiVRC-linux-x64.zip) { $files += 'MultiVRC-linux-x64.zip', 'MultiVRC-linux-x64.zip.sha256' }
          gh release create "${{ github.ref_name }}" @files --title "MultiVRC ${{ github.ref_name }}" --generate-notes @extra
