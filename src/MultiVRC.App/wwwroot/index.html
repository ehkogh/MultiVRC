<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MultiVRC</title>
    <base href="/" />
    <!-- Inline so the splash paints on the first frame, before app.css or Blazor have loaded. -->
    <style>
        html, body { margin: 0; height: 100%; background: #0b0d12; }
        .splash {
            position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px;
            background: radial-gradient(60% 50% at 50% 45%, #6ff0bf0d, transparent 70%), #0b0d12;
            font: 600 12px "Outfit", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
            letter-spacing: .06em; color: #8e97a8; user-select: none;
        }
        .splash-mark { position: relative; width: 92px; height: 92px; display: grid; place-items: center; }
        .splash-mark svg { width: 52px; height: 52px; }
        .splash-ring {
            position: absolute; inset: 0; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0 40%, #6ff0bf 75%, #6aa8ff);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
            animation: splash-spin .9s linear infinite;
        }
        .splash-track { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 3px #ffffff0d; }
        /* Only says anything if starting takes a while, so a quick start is just the logo. */
        .splash-text { opacity: 0; animation: splash-show .4s ease-out 1.2s forwards; }
        @keyframes splash-spin { to { transform: rotate(1turn); } }
        @keyframes splash-show { to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .splash-ring { animation-duration: 2.4s; } }
    </style>
    <link rel="stylesheet" href="app.css" />
</head>
<body>
    <app>
        <div class="splash" role="status" aria-label="Starting MultiVRC">
            <div class="splash-mark">
                <span class="splash-track"></span>
                <span class="splash-ring"></span>
                <svg viewBox="0 0 32 32" aria-hidden="true">
                    <defs><linearGradient id="splash-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cf0c4" /><stop offset="1" stop-color="#6aa8ff" /></linearGradient></defs>
                    <rect x="2" y="2" width="28" height="28" rx="10" fill="url(#splash-grad)" />
                    <path d="M9 11.5 14 22l2-4.2M23 11.5 18 22" stroke="#0d1014" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <div class="splash-text">Starting MultiVRC</div>
        </div>
    </app>
    <script src="_framework/blazor.webview.js"></script>
    <script src="reorder.js"></script>
    <script src="settings.js"></script>
</body>
</html>
